name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOTNET_VERSION: '10.0.x' # set this to the dotnet version to use (e.g. '2.1.x', '3.1.x', '5.0.x')

jobs:
  build-and-publish:

    permissions:
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup .NET ${{ env.DOTNET_VERSION }} Environment'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Get version from tag'
        id: get_version
        run: |
          tag="$GITHUB_REF_NAME"
          echo "version=${tag:1}" >> $GITHUB_OUTPUT

      - name: 'Restore'
        run: dotnet restore

      - name: 'Build'
        run: dotnet build -p:Version=${{ steps.get_version.outputs.version }} --configuration Release --no-restore

      - name: 'Test'
        run: dotnet test --configuration Release --no-build

      - name: 'Pack'
        run: dotnet pack -p:PackageVersion=${{ steps.get_version.outputs.version }} --configuration Release --no-build --output ./artifacts 

      - name: 'NuGet login (OIDC → temp API key)'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 'NuGet push'
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
